name: ESPN live poll

# Le pega a ESPN desde un runner de GitHub Actions (Azure) en vez de desde
# Vercel (AWS), porque Akamai bloquea el origen de Vercel con 403 de forma
# consistente - confirmado en los Runtime Logs de produccion. Si el fetch
# prospera, deja el resultado como JSON estatico en public/data/espn-live/ y
# el sitio lo sirve sin volver a pegarle a ESPN.
#
# Corre todos los dias, no solo domingo/lunes/jueves. Restringir a esos tres
# se penso para ahorrar minutos de Action en un repo privado (limitados por
# mes), pero este repo es publico: en un repo publico GitHub Actions es
# gratis e ilimitado, asi que no hay razon para dejar un hueco. Sin esto,
# alguien mirando el viernes el resultado del jueves (o un partido de
# International Series con horario atipico) se encontraba con datos viejos
# porque el cron simplemente no corria ese dia.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

concurrency:
  group: espn-live-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Traer datos de ESPN
        run: node scripts/fetch-espn-live.mjs

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/espn-live/
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
          else
            git commit -m "Actualizar datos en vivo de ESPN [skip ci]"
            git push
          fi
