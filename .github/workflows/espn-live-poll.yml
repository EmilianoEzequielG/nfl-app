name: ESPN live poll

# Le pega a ESPN desde un runner de GitHub Actions (Azure) en vez de desde
# Vercel (AWS), porque Akamai bloquea el origen de Vercel con 403 de forma
# consistente - confirmado en los Runtime Logs de produccion. Si el fetch
# prospera, deja el resultado como JSON estatico en public/data/espn-live/ y
# el sitio lo sirve sin volver a pegarle a ESPN.
#
# Corre lunes, martes, jueves, viernes y domingo (por ahora - sin miercoles
# ni sabado). El repo es publico, asi que GitHub Actions es gratis e
# ilimitado; no restringir por costo, solo por los dias que interesa cubrir.

on:
  schedule:
    - cron: "*/10 * * * 0,1,2,4,5"
  workflow_dispatch: {}

concurrency:
  group: espn-live-poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # El script ya reintenta el fetch en si mismo (hasta 4 veces, con
      # backoff, ver scripts/fetch-espn-live.mjs) - pero las primeras 7
      # corridas de este workflow fallaron las 7 pese a eso, mientras que el
      # mismo script corrido a mano en otra maquina funciono al primer
      # intento. El bloqueo intermitente de Akamai que ya se habia detectado
      # parece pegarle mas duro al rango de IP de GitHub Actions que a otros
      # origenes. Reintentar el STEP completo (no solo el fetch adentro del
      # mismo proceso) relanza Node desde cero cada vez con mas espera entre
      # intentos, dandole mas chances de caer en una ventana en la que
      # Akamai no este bloqueando.
      - name: Traer datos de ESPN
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 2
          max_attempts: 5
          retry_wait_seconds: 30
          command: node scripts/fetch-espn-live.mjs

      - name: Commit y push si hubo cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/espn-live/
          if git diff --cached --quiet; then
            echo "Sin cambios, nada que commitear."
          else
            git commit -m "Actualizar datos en vivo de ESPN [skip ci]"
            git push
          fi
